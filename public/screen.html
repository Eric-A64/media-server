function getPlayerColor(name = "") {
  let hash = 0;

  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }

  const hue = Math.abs(hash) % 360;

  return `hsl(${hue}, 80%, 60%)`;
}






function createMediaElement(media) {
  let el;

 if (typeof media === 'object') {

  if (media.image) {
    el = document.createElement('img');
    el.src = media.image;
  }

  if (media.audio) {
    playExclusiveSound(media.audio);

    if (!el) { // 👈 IMPORTANT
      el = document.createElement('audio');
      el.src = media.audio;
      el.controls = true;
    }
  }

  return el;
}

  if (media.match(/\.(mp4|webm|ogg)$/i)) {
    el = document.createElement('video');
    el.src = media;
    el.controls = true;
    el.autoplay = true;
    

  } else if (media.match(/\.(mp3|wav|ogg)$/i)) {
    el = document.createElement('audio');
    el.src = media;
    el.controls = true;
    

    playExclusiveSound(media); // 🔥 clé

  } else {
    el = document.createElement('img');
    el.src = media;
  }

  return el;
}

    currentAudio.currentTime = 0;

function startCountdown(seconds){
  let timeLeft = seconds;

  timerDisplay.textContent =
    `⏳ Temps restant : ${timeLeft}s`;

  timerDisplay.style.display = 'block';

  clearInterval(countdownInterval);

  countdownInterval = setInterval(() => {

    timeLeft--;

    timerDisplay.textContent =
      timeLeft <= 0
        ? '⏳ Temps écoulé !'
        : `⏳ Temps restant : ${timeLeft}s`;

    if(timeLeft <= 0)
      clearInterval(countdownInterval);

  }, 1000);
}

  }

function showOptionsSequentially(options){

  // ❌ FIX IMPORTANT : fonction inexistante supprimée
  // clearOptionAnimations();

  optionsList.innerHTML = '';

  const liElements = options.map(opt => {
    const li = document.createElement('li');
    li.textContent = opt;

    const dirs = [
      'translateY(20px)',
      'translateY(-20px)',
      'translateX(20px)',
      'translateX(-20px)'
    ];

    const rotation = (Math.random() - 0.5) * 10;

    li.style.transform =
      `${dirs[Math.floor(Math.random()*dirs.length)]}
       rotate(${rotation}deg)
       scale(0.98)`;

    li.style.opacity = 0;

    optionsList.appendChild(li);

    return li;
  });

  const indices = liElements.map((_, i) => i);

  for(let i = indices.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }

  indices.forEach((idx, order) => {
    const li = liElements[idx];

    const timeoutId = setTimeout(() => {
      li.style.transition = 'opacity 0.45s ease, transform 0.45s ease';
      li.style.opacity = 1;
      li.style.transform = 'translate(0,0) rotate(0deg) scale(1)';

      playSfx(optionSounds[idx % optionSounds.length]);

    }, order * 700);

    optionTimeouts.push(timeoutId);
  });
}

function playJoinSound() {

  const src = joinSounds[Math.floor(Math.random() * joinSounds.length)];

  const audio = new Audio(src);
  audio.volume = 1;

  // 🔥 IMPORTANT : ne pas être tué par stopAllAudio
  audio.classList.add("join-sfx");

  };
}



    

function runAt(time, fn) {

    const delay = time - Date.now();

    if (delay <= 0) {
        fn();
    } else {
        setTimeout(fn, delay);
    }
}




function normalize(raw) {
    if (!raw) return null;
    if (Array.isArray(raw)) raw = raw[0];

    if (typeof raw === "string") return { url: raw };

    const url = raw.url || raw.media || raw.audio || raw.video || null;

    return {
        url,
        audio: raw.audio || (url?.match(/\.(mp3|wav|ogg)$/i) ? url : null),
        video: raw.video || (url?.match(/\.(mp4|webm)$/i) ? url : null),
        image: raw.image || (url?.match(/\.(jpg|jpeg|png|gif)$/i) ? url : null),
        executeAt: raw.executeAt || null
    };
}

async function playExclusiveSound(src){
  if(!soundEnabled) return;

  try {
    stopCurrentAudio();
    currentAudio = new Audio(src);
    await currentAudio.play();
  } catch (e) {
    console.warn("SFX blocked:", e);
  }
}

function renderMedia(container, raw) {

    const data = normalize(raw);
    if (!data) return;

    container.innerHTML = "";

    const render = () => {

        // 🎥 VIDEO
        if (data.video) {
            const v = document.createElement("video");
            v.src = data.video;
            v.autoplay = true;
            v.controls = true;
            v.playsInline = true;
            container.appendChild(v);
            return;
        }

        // 🖼 IMAGE
        if (data.image) {
            const img = document.createElement("img");
            img.src = data.image;
            container.appendChild(img);
            return;
        }

        // 🔊 AUDIO (ONLY HERE)
        if (data.audio) {
            playAudio(data.audio);
            return;
        }

        console.warn("❌ MEDIA NON RECONNU:", data);
    };

    if (data.executeAt) {
        const delay = data.executeAt - Date.now();
        if (delay > 0) setTimeout(render, delay);
        else render();
    } else {
        render();
    }
}
    

function playAudio(src) {
    if (!src) return;

    globalAudio.pause();
    globalAudio.currentTime = 0;
    globalAudio.src = src;
    globalAudio.load();

    globalAudio.play()
        .then(() => console.log("🔊 AUDIO PLAY:", src))
        .catch(err => console.warn("🔇 AUDIO BLOCKED:", err));
}

globalAudio.onended = () => {
    console.log("🔊 AUDIO FINI");
};

socket.on('updateScores', (scores) => {

    window.latestScores = scores;

    // IMPORTANT : ne pas écraser si score screen actif
    if (!scoreScreenActive) {

        if (
            !scores ||
            Object.keys(scores).length === 0
        ) {
            scoreboard.innerHTML = "<p>Aucun score pour le moment.</p>";
            return;
        }

        const sorted = Object.entries(scores)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10);

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');

        const headerRow = document.createElement('tr');

        headerRow.innerHTML = `
            <th>🏆</th>
            <th>JOUEURS</th>
            <th>SCORES</th>
        `;

        thead.appendChild(headerRow);

        sorted.forEach(([player, score], index) => {

            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${player}</td>
                <td>${score}</td>
            `;

            tbody.appendChild(row);

        });

        table.appendChild(thead);
        table.appendChild(tbody);

        scoreboard.innerHTML = '';
        scoreboard.appendChild(table);
    }

});

socket.on('updateWaitingRoom', (players) => {

  window.lastPlayers = players;

  const counter = document.getElementById('playerCount'); // 👈 AJOUT IMPORTANT

  if (!list) return;

  list.innerHTML = '';

  players.forEach(name => {
    const div = document.createElement('div');
    div.textContent = name;
    div.className = "player";

    // 🎨 COULEUR MULTICOLORE
    const color = getPlayerColor(name);

    div.style.border = "2px solid rgba(255,255,255,0.25)";
    div.style.color = "#fff";

    list.appendChild(div);
  });

  // =========================
  // 👥 UPDATE COMPTEUR JOUEURS
  // =========================
  if (counter) {
    counter.textContent = players.length;
  }

  // =========================
  // 🔥 DETECT NOUVEAUX JOUEURS
  // =========================

  const oldSet = new Set(previousPlayers || []);
  const newPlayers = players.filter(p => !oldSet.has(p));

  newPlayers.forEach(() => playJoinSound());



  previousPlayers = [...players];




});
